<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="1080" height="600" fill="#ffffff"/>

  <!-- 标题区：独占顶部，下方留白，任何连线不进入 y < 92 -->
  <text x="540" y="46" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Pi Agent 一次带工具调用的运行流程</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 主流程一行：y 110-180 -->
  <rect x="30" y="110" width="130" height="70" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="95" y="152" text-anchor="middle" font-size="14" fill="#1e1b4b">用户输入</text>

  <rect x="205" y="110" width="180" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="295" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">coding-agent</text>
  <text x="295" y="162" text-anchor="middle" font-size="12" fill="#0c4a6e">CLI / TUI 交互</text>

  <rect x="430" y="110" width="180" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">agent</text>
  <text x="520" y="162" text-anchor="middle" font-size="12" fill="#14532d">Agent 循环 / 上下文</text>

  <rect x="655" y="110" width="150" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="730" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">ai</text>
  <text x="730" y="162" text-anchor="middle" font-size="12" fill="#78350f">模型调用抽象</text>

  <rect x="850" y="110" width="200" height="70" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="950" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#831843">远程模型服务</text>
  <text x="950" y="162" text-anchor="middle" font-size="12" fill="#831843">deepseek-v4-pro</text>

  <!-- 主流程横向箭头 -->
  <line x1="160" y1="145" x2="201" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="385" y1="145" x2="426" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="610" y1="145" x2="651" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="805" y1="130" x2="846" y2="130" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="846" y1="160" x2="805" y2="160" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ① 标记：模型请求前打印日志 -->
  <circle cx="631" cy="145" r="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="631" y="149" text-anchor="middle" font-size="11" fill="#b91c1c">①</text>

  <text x="826" y="122" text-anchor="middle" font-size="10" fill="#374151">请求</text>
  <text x="826" y="180" text-anchor="middle" font-size="10" fill="#374151">回复</text>

  <!-- 本地工具执行 -->
  <rect x="400" y="330" width="160" height="80" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">本地工具执行</text>
  <text x="480" y="378" text-anchor="middle" font-size="11" fill="#4c1d95">read → practice4.txt</text>
  <text x="480" y="396" text-anchor="middle" font-size="10" fill="#6d28d9">由程序执行，不经模型</text>

  <!-- agent -> 工具：模型返回工具调用指令 -->
  <line x1="450" y1="182" x2="450" y2="326" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="440" y="256" text-anchor="end" font-size="11" fill="#5b21b6">模型返回工具调用指令</text>

  <!-- 工具 -> agent：工具结果写回上下文 -->
  <line x1="520" y1="326" x2="520" y2="184" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arG)"/>
  <circle cx="520" cy="300" r="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
  <text x="520" y="304" text-anchor="middle" font-size="11" fill="#16a34a">②</text>

  <!-- 虚线回流通道：图形下方独立走线，不进入标题区 -->
  <path d="M590,182 L590,462 L730,462 L730,184" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arR)"/>
  <text x="662" y="486" text-anchor="middle" font-size="11" fill="#b91c1c">虚线：带着工具结果再发起新一轮模型请求（回到 ①）</text>

  <!-- 底部说明 -->
  <rect x="30" y="506" width="1020" height="60" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="48" y="530" font-size="12" fill="#374151">① 每轮把上下文交给模型前，打印「[P4] Agent 即将请求模型」</text>
  <text x="48" y="552" font-size="12" fill="#374151">② 每条工具结果写入 currentContext.messages 后，打印「[P4] 工具结果已加入上下文」</text>
</svg>
